<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect fill="url(#bgGradient)" width="1920" height="1080"/>
  
  <!-- Decorative athletic elements -->
  <circle cx="1700" cy="150" r="280" fill="#ff6b35" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="900" r="350" fill="#ff6b35" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1800" cy="800" r="200" fill="#ff6b35" opacity="0.05"/>
  
  <!-- Geometric shapes - athletic theme -->
  <line x1="0" y1="0" x2="400" y2="400" stroke="#ff6b35" stroke-width="2" opacity="0.1"/>
  <line x1="1920" y1="0" x2="1520" y2="400" stroke="#ff6b35" stroke-width="2" opacity="0.1"/>
  <line x1="0" y1="1080" x2="500" y2="580" stroke="#ff6b35" stroke-width="2" opacity="0.1"/>
  <line x1="1920" y1="1080" x2="1420" y2="580" stroke="#ff6b35" stroke-width="2" opacity="0.1"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ff6b35" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Accent rectangles -->
  <rect x="50" y="50" width="300" height="300" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.15"/>
  <rect x="1570" y="50" width="300" height="300" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.15"/>
  <rect x="50" y="730" width="300" height="300" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.15"/>
  <rect x="1570" y="730" width="300" height="300" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.15"/>
  
  <!-- Text overlay suggestion (optional) -->
  <text x="960" y="100" font-size="28" fill="#ff6b35" opacity="0.15" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="8">ATHLETIC EXCELLENCE</text>
</svg>